services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pufmfa
      POSTGRES_PASSWORD: pufmfa_secret
      POSTGRES_DB: puf_mfa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  puf-bridge:
    build: ./puf-bridge
    ports:
      - "8765:8765"
    environment:
      PUF_DEVICE_ID: virtual-cmod-a7-001
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
      - puf-bridge
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/auth
    depends_on:
      - backend

volumes:
  pgdata:
