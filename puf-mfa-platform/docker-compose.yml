services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pufmfa
      POSTGRES_PASSWORD: pufmfa_secret
      POSTGRES_DB: puf_mfa
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  puf-bridge:
    build: ./puf-bridge
    expose:
      - "8765"
    environment:
      PUF_DEVICE_ID: virtual-cmod-a7-001
    restart: unless-stopped

  backend:
    build: ./backend
    expose:
      - "8000"
    env_file: .env
    environment:
      VIRTUAL_PUF_HOST: puf-bridge
      DATABASE_URL: postgresql://pufmfa:pufmfa_secret@db:5432/puf_mfa
    depends_on:
      - db
      - puf-bridge
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_API_URL: https://localhost
      NEXT_PUBLIC_WS_URL: wss://localhost/ws/auth
    depends_on:
      - backend

  reverse-proxy:
    image: caddy:2-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
