name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-config:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: puf-mfa-platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -c "from app.config import settings, validate_security_settings; validate_security_settings(settings); print('Dev security config baseline OK')"
      - run: python -c "from app.config import settings, validate_security_settings; validate_security_settings(settings); print('Prod security config OK')"
        env:
          APP_ENV: production
          SECRET_KEY: this-is-a-very-strong-ci-secret-key-123456789
          ADMIN_PASSWORD: strong-admin-password-123
          TWILIO_ACCOUNT_SID: AC1234567890
          TWILIO_AUTH_TOKEN: token123
          COOKIE_SECURE: "true"
          CORS_ORIGINS: https://example.com

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: puf-mfa-platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -c "import app.main; print('Backend OK')"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: puf-mfa-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: puf-mfa-platform/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://localhost
          NEXT_PUBLIC_WS_URL: wss://localhost/ws/auth
